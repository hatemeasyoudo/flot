/* ---------------------------------------------------------------
   Логин — тот же администратор, что и в панели бронирований
--------------------------------------------------------------- */
function Login({ onLoggedIn }){
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  async function submit(e){
    e.preventDefault();
    setLoading(true); setError('');
    const { error: err } = await sb.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (err){ setError('Неверная почта или пароль.'); return; }
    onLoggedIn();
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4" style={{background:'radial-gradient(1100px 500px at 15% -10%, rgba(23,168,146,0.14), transparent 60%)'}}>
      <form onSubmit={submit} className="card rounded-2xl p-6 w-full max-w-sm space-y-4">
        <div className="text-center mb-2">
          <div className="w-11 h-11 rounded-2xl bg-brand-500/15 border border-brand-500/40 flex items-center justify-center mx-auto mb-3 text-[19px]">✎</div>
          <h1 className="font-serif text-[20px]">Тексты сайта</h1>
          <p className="text-[12px] muted mt-1">Флот — вход тот же, что и в админку бронирований</p>
        </div>
        <div>
          <label className="text-[12px] muted block mb-1.5">Почта</label>

        </div>
        <div>
          <label className="text-[12px] muted block mb-1.5">Пароль</label>
          <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} className="field w-full rounded-lg px-3 py-2.5 text-[13.5px]"/>
        </div>
        {error && <div className="text-[12.5px] text-red-400">{error}</div>}
        <button disabled={loading} className="w-full bg-brand-500 hover:bg-brand-400 disabled:opacity-60 text-white rounded-lg py-2.5 text-[13.5px] font-semibold flex items-center justify-center gap-2">
          {loading && <span className="spinner"></span>} Войти
        </button>
      </form>
    </div>
  );
}

/* ---------------------------------------------------------------
   Одно поле — значение, статус сохранения, кнопка "Сохранить"
--------------------------------------------------------------- */
function Field({ field, savedValue, onSaved, previewApi }){
  const [value, setValue] = useState(savedValue || '');
  const [status, setStatus] = useState('idle'); // idle | saving | saved | error
  const dirty = value !== (savedValue || '');
  const highlightRef = useRef(null);

  useEffect(() => { setValue(savedValue || ''); }, [savedValue]);

  function handleFocus(){
    if (previewApi) highlightRef.current = previewApi.highlight(field.key);
  }
  function handleBlur(){
    if (previewApi) previewApi.clear(highlightRef.current);
    highlightRef.current = null;
  }

  async function save(){
    setStatus('saving');
    const { error } = await sb.from('site_content')
      .upsert({ key: field.key, value: value, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if (error){ setStatus('error'); return; }
    setStatus('saved');
    onSaved(field.key, value);
    setTimeout(() => setStatus(s => s === 'saved' ? 'idle' : s), 1800);
  }

  const Tag = field.multiline ? 'textarea' : 'input';

  return (
    <div className="mb-4">
      <div className="flex items-center justify-between gap-3 mb-1.5">
        <label className="text-[12.5px] muted">{field.label}</label>
        <div className="flex items-center gap-2 text-[11.5px]">
          {status === 'saving' && <span className="muted flex items-center gap-1.5"><span className="spinner"></span>Сохраняю…</span>}
          {status === 'saved' && <span className="text-brand-300">Сохранено ✓</span>}
          {status === 'error' && <span className="text-red-400">Ошибка сохранения</span>}
          <button
            onClick={save}
            disabled={!dirty || status === 'saving'}
            className={`px-2.5 py-1 rounded-md text-[11.5px] font-semibold border transition ${dirty ? 'bg-brand-500/20 border-brand-500/40 text-brand-200 hover:bg-brand-500/30 cursor-pointer' : 'border-white/10 text-white/25 cursor-default'}`}
          >Сохранить</button>
        </div>
      </div>
      <Tag
        className="field w-full rounded-lg px-3 py-2.5 text-[13.5px] leading-relaxed"
        rows={field.multiline ? 3 : undefined}
        value={value}
        onChange={e => setValue(e.target.value)}
        onFocus={handleFocus}
        onBlur={handleBlur}
      />
    </div>
  );
}

/* ---------------------------------------------------------------
   Основная панель
--------------------------------------------------------------- */
function Editor(){
  const [values, setValues] = useState(null);
  const [error, setError] = useState('');
  const [search, setSearch] = useState('');
  const [previewLoaded, setPreviewLoaded] = useState(false);
  const [previewOpen, setPreviewOpen] = useState(true);
  const frameRef = useRef(null);

  const load = useCallback(async () => {
    const { data, error: err } = await sb.from('site_content').select('key,value');
    if (err){ setError('Не удалось загрузить тексты. Убедитесь, что в Supabase выполнен файл site-content-schema.sql.'); return; }
    const map = {};
    (data || []).forEach(row => { map[row.key] = row.value; });
    setValues(map);
  }, []);

  useEffect(() => { load(); }, [load]);

  function onSaved(key, value){
    setValues(v => ({ ...v, [key]: value }));
  }

  async function logout(){
    await sb.auth.signOut();
    window.location.reload();
  }

  function refreshPreview(){
    const frame = frameRef.current;
    if (!frame) return;
    setPreviewLoaded(false);
    frame.src = SITE_URL + '?t=' + Date.now();
  }

  function scrollToAnchor(anchor){
    const frame = frameRef.current;
    if (!frame || !previewLoaded) return;
    try {
      const doc = frame.contentDocument;
      const el = anchor && doc.getElementById(anchor);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) { /* игнорируем, если превью ещё не готово */ }
  }

  // API для полей: подсветить в превью элемент, соответствующий редактируемому тексту
  const previewApi = {
    highlight(key){
      const frame = frameRef.current;
      if (!frame || !previewLoaded) return null;
      try {
        const doc = frame.contentDocument;
        const el = doc.querySelector(`[data-content-key="${key}"]`);
        if (!el) return null;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.style.outline = '3px solid #f5a623';
        el.style.outlineOffset = '2px';
        el.style.borderRadius = '4px';
        el.style.background = 'rgba(245,166,35,0.16)';
        return el;
      } catch (e) { return null; }
    },
    clear(el){
      if (!el) return;
      try {
        el.style.outline = '';
        el.style.outlineOffset = '';
        el.style.background = '';
      } catch (e) {}
    }
  };

  if (error){
    return (
      <div className="min-h-screen flex items-center justify-center px-4 text-center">
        <div className="card rounded-2xl p-6 max-w-md">
          <p className="text-[14px] mb-3">{error}</p>
          <button onClick={load} className="text-[13px] px-4 py-2 rounded-lg bg-brand-500 hover:bg-brand-400 text-white font-semibold">Повторить</button>
        </div>
      </div>
    );
  }

  if (!values){
    return <div className="min-h-screen flex items-center justify-center"><span className="spinner"></span></div>;
  }

  const q = search.trim().toLowerCase();
  const groups = q
    ? GROUPS.map(g => ({ ...g, fields: g.fields.filter(f =>
        f.label.toLowerCase().includes(q) || (values[f.key] || '').toLowerCase().includes(q)
      )})).filter(g => g.fields.length)
    : GROUPS;

  return (
    <div className="min-h-screen pb-16 lg:flex lg:items-start">
      {/* ---- Колонка редактирования ---- */}
      <div className="lg:w-[52%] lg:h-screen lg:overflow-y-auto">
        <div className="sticky top-0 z-10 backdrop-blur bg-[#0b1420]/90 border-b border-white/10">
          <div className="px-4 py-4 flex items-center justify-between gap-3">
            <div>
              <h1 className="font-serif text-[18px]">Тексты сайта «Флот»</h1>
              <p className="text-[11.5px] muted">Нажмите на поле — справа подсветится этот же текст на сайте. Меняйте и жмите «Сохранить».</p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => setPreviewOpen(o => !o)} className="lg:hidden text-[12px] px-3 py-2 rounded-lg border border-white/15 muted hover:text-white hover:border-white/30 whitespace-nowrap">
                {previewOpen ? 'Скрыть сайт' : 'Показать сайт'}
              </button>
              <button onClick={logout} className="text-[12px] px-3 py-2 rounded-lg border border-white/15 muted hover:text-white hover:border-white/30 whitespace-nowrap">Выйти</button>
            </div>
          </div>
          <div className="px-4 pb-4">
            <input
              placeholder="Поиск по полям…"
              value={search}
              onChange={e => setSearch(e.target.value)}
              className="field w-full rounded-lg px-3 py-2 text-[13px]"
            />
          </div>
        </div>

        <div className="px-4 pt-6 space-y-8">
          {groups.map(g => (
            <div key={g.title} className="card rounded-2xl p-5">
              <button
                onClick={() => scrollToAnchor(g.anchor)}
                className="text-[14px] font-semibold mb-4 text-brand-200 flex items-center gap-2 hover:text-brand-100"
                title="Показать этот раздел в превью"
              >
                {g.title}
                <span className="text-[11px] font-normal muted">→ показать на сайте</span>
              </button>
              {g.fields.map(f => (
                <Field key={f.key} field={f} savedValue={values[f.key]} onSaved={onSaved} previewApi={previewApi} />
              ))}
            </div>
          ))}
          {groups.length === 0 && <p className="muted text-[13px] text-center py-10">Ничего не найдено.</p>}
        </div>
      </div>

      {/* ---- Колонка живого превью сайта ---- */}
      <div className={`lg:w-[48%] lg:h-screen lg:sticky lg:top-0 border-l border-white/10 bg-[#060b12] ${previewOpen ? 'block' : 'hidden'} lg:block`}>
        <div className="flex items-center justify-between px-3 py-2 border-b border-white/10 bg-[#0b1420]">
          <span className="text-[11.5px] muted">Предпросмотр сайта — обновляется после сохранения</span>
          <button onClick={refreshPreview} className="text-[11.5px] px-2.5 py-1 rounded-md border border-white/15 muted hover:text-white hover:border-white/30">Обновить</button>
        </div>
        <div className="relative h-[70vh] lg:h-[calc(100vh-37px)]">
          {!previewLoaded && (
            <div className="absolute inset-0 flex items-center justify-center bg-[#060b12]"><span className="spinner"></span></div>
          )}
          <iframe
            ref={frameRef}
            src={SITE_URL}
            title="Предпросмотр сайта"
            onLoad={() => setPreviewLoaded(true)}
            className="w-full h-full border-0"
          />
        </div>
      </div>
    </div>
  );
}

function App(){
  const [session, setSession] = useState(undefined); // undefined = проверяем, null = не вошли

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined){
    return <div className="min-h-screen flex items-center justify-center"><span className="spinner"></span></div>;
  }
  if (!session){
    return <Login onLoggedIn={() => {}} />;
  }
  return <Editor />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
